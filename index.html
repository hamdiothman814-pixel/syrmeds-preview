<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/syrmeds-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="دليل الأدوية السورية — أسعار نشرة وزارة الصحة، الاستطبابات، البدائل والمحاذير">
  <meta name="theme-color" content="#084C3F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="دليل الأدوية السورية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>دليل الأدوية السورية</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #084C3F; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0C6B57 0%, #084C3F 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      transition: opacity .35s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 84px; height: 84px; border-radius: 22px;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
      display: flex; align-items: center; justify-content: center;
    }
    #splash h1 { color: #fff; font-size: 24px; margin: 16px 0 4px; font-weight: 700; }
    #splash p { color: rgba(255,255,255,.75); font-size: 13px; margin: 0 0 26px; }
    #splash .spin {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25); border-top-color: #D97706;
      animation: sp 0.9s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
        <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3z" fill="#ffffff"/>
      </svg>
    </div>
    <h1>دليل الأدوية السورية</h1>
    <p>أسعار النشرة الرسمية • البدائل والمحاذير</p>
    <div class="spin"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('done'); setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
